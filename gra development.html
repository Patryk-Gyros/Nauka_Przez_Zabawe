<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>DEV – Koło Fortuny</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#eef4fb,#ffffff);
  margin:0;
  text-align:center;
}

header{
  font-family:"Playfair Display",serif;
  padding:20px 0 10px 0;
  font-size:28px;
}

#wheel-box{
  position:relative;
  width:340px;
  height:340px;
  margin:20px auto;
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:8px solid #222;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform 4s cubic-bezier(.2,.7,.25,1);
  background:conic-gradient(
    #1E5E44 0 60deg,
    #F0B234 60deg 120deg,
    #EB703C 120deg 180deg,
    #CA366C 180deg 240deg,
    #EC962E 240deg 300deg,
    #489EA0 300deg 360deg
  );
  position:relative;
}

.segment{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  transform-origin:center center;
  pointer-events:none;
}

.segment span{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -148px);
  display:inline-block;
  text-align:center;
  font-weight:600;
  font-size:13px;
  line-height:1.15;
  letter-spacing:.3px;
  max-width:120px;
  white-space:normal;
  word-break:keep-all;
}

.segment.active span{
  background:rgba(255,255,255,.97);
  padding:0 2px;
  border-radius:2px;
  box-shadow:0 0 3px rgba(255,255,255,.6);
}

#pointer{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  color:#ff3b3b;
}

#spinBtn{
  margin-top:20px;
  padding:12px 36px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:linear-gradient(#ffb74d,#f57c00);
  color:white;
  cursor:pointer;
  transition:.3s;
}

#spinBtn:disabled{
  background:linear-gradient(#bdbdbd,#9e9e9e);
  transform:scale(.96);
  cursor:not-allowed;
}

.answer{
  margin:8px auto;
  padding:10px;
  border-radius:10px;
  border:2px solid #444;
  background:#f7f7f7;
  cursor:pointer;
  width:420px;
  max-width:90%;
}

.correct{ background:#c8f7c5; }
.wrong{ background:#ffcdd2; }

#panel{ margin-top:20px; }
#feedback{ margin-top:10px; display:none; }
</style>
</head>

<body>

<header>🎡 DEV – Test przycisku</header>

<div id="wheel-box">
  <div id="pointer">🔻</div>
  <div id="wheel"></div>
</div>

<button id="spinBtn" onclick="spin()">Zakręć kołem</button>

<div id="panel"></div>
<div id="feedback"></div>

<script>

const categories = [
 {name:"Cesarstwo Bizantyjskie", questions:[
   {q:"Test pytanie?", a:["Poprawna","Zła 1","Zła 2"], correct:0, explanation:"To jest wyjaśnienie."}
 ]},
 {name:"Justynian", questions:[
   {q:"Test?", a:["Tak","Nie","Może"], correct:0, explanation:"Wyjaśnienie."}
 ]},
 {name:"Hagia Sophia", questions:[
   {q:"Test?", a:["1","2","3"], correct:0, explanation:"Wyjaśnienie."}
 ]},
 {name:"Konstantynopol", questions:[
   {q:"Test?", a:["1","2","3"], correct:0, explanation:"Wyjaśnienie."}
 ]},
 {name:"Upadek", questions:[
   {q:"Test?", a:["1","2","3"], correct:0, explanation:"Wyjaśnienie."}
 ]},
 {name:"Kultura", questions:[
   {q:"Test?", a:["1","2","3"], correct:0, explanation:"Wyjaśnienie."}
 ]}
];

const wheel=document.getElementById("wheel");
const spinBtn=document.getElementById("spinBtn");
const panel=document.getElementById("panel");
const feedback=document.getElementById("feedback");

categories.forEach((cat,index)=>{
  const segment=document.createElement("div");
  segment.className="segment";
  segment.style.transform=`rotate(${index*60+30}deg)`;
  const label=document.createElement("span");
  label.innerText=cat.name;
  segment.appendChild(label);
  wheel.appendChild(segment);
});

let rotation=0;
let spinning=false;

function spin(){

 if(spinning) return;

 spinning=true;
 panel.innerHTML="";
 feedback.style.display="none";

 const index=Math.floor(Math.random()*6);
 const targetAngle=(360-(index*60+30))%360;

 rotation+=720+targetAngle-(rotation%360);
 wheel.style.transform=`rotate(${rotation}deg)`;

 setTimeout(()=>{
   showQuestion(index);
   spinning=false;
 },4000);
}

function showQuestion(index){

 const q=categories[index].questions[0];

 panel.innerHTML=`<b>${categories[index].name}</b><br><br>${q.q}`;

 q.a.forEach((text,i)=>{
   const btn=document.createElement("div");
   btn.className="answer";
   btn.innerText=text;

   btn.onclick=function(){

     if(btn.classList.contains("correct") || btn.classList.contains("wrong")) return;

     if(i===q.correct){
       btn.classList.add("correct");
       feedback.innerHTML=q.explanation;
     }else{
       btn.classList.add("wrong");
       feedback.innerHTML="Niepoprawna odpowiedź.<br><br>"+q.explanation;
     }

     feedback.style.display="block";

     spinBtn.disabled = true;   // 🔥 TU SZARZEJE

     setTimeout(()=>{
       spinBtn.disabled = false;  // 🔥 TU WRACA
     },4000);
   };

   panel.appendChild(btn);
 });
}

</script>

</body>
</html>
