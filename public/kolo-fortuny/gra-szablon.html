<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>__TITLE__</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#eef4fb,#ffffff);
  margin:0;
  text-align:center;
}

header{
  font-family:"Playfair Display",serif;
  padding:10px 0 4px 0;
  font-size:24px;
}

#scoreBox{
  display:inline-block;
  margin-top:6px;
  padding:6px 18px;
  font-size:15px;
  background:white;
  border-radius:20px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
}

#wheel-box{
  position:relative;
  width:340px;
  height:340px;
  margin:15px auto 0 auto;
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  border:8px solid #222;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:transform 4s cubic-bezier(.2,.7,.25,1);
  background:conic-gradient(
    #1E5E44 0 60deg,
    #F0B234 60deg 120deg,
    #EB703C 120deg 180deg,
    #CA366C 180deg 240deg,
    #EC962E 240deg 300deg,
    #489EA0 300deg 360deg
  );
  position:relative;
}

/* ===== RADIALNY SYSTEM Z DEV ===== */

.segment{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  transform-origin:center center;
  pointer-events:none;
  transition:opacity .4s ease;
}

.segment span{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, -148px);
  display:inline-block;
  text-align:center;
  font-weight:600;
  font-size:13px;
  line-height:1.15;
  letter-spacing:.3px;
  max-width:120px;
  white-space:normal;
  word-break:keep-all;
}

.segment.active span{
  background:rgba(255,255,255,.97);
  padding:0 2px;
  border-radius:2px;
  box-shadow:0 0 3px rgba(255,255,255,.6);
}

.segment.completed{
  opacity:.25;
}

#pointer{
  position:absolute;
  top:-22px;
  left:50%;
  transform:translateX(-50%);
  font-size:32px;
  color:#ff3b3b;
  text-shadow:0 0 8px rgba(255,0,0,.6);
  z-index:5;
}

#spinBtn{
  margin-top:20px;
  padding:12px 36px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:linear-gradient(#ffb74d,#f57c00);
  color:white;
  cursor:pointer;
  transition:.3s;
}

#spinBtn:disabled{
  background:linear-gradient(#bdbdbd,#9e9e9e);
  transform:scale(.96);
  cursor:not-allowed;
}

.answer{
  margin:8px auto;
  padding:10px;
  border-radius:10px;
  border:2px solid #444;
  background:#f7f7f7;
  cursor:pointer;
  transition:.25s;
  width:420px;
  max-width:90%;
}
.answer:hover{
  background:#ffffff;
  transform:translateY(-2px);
}
.correct{ background:#c8f7c5 !important; border-color:#2e7d32 !important; }
.wrong{ background:#ffcdd2 !important; border-color:#c62828 !important; }

#feedback{
  display:none;
  margin-top:10px;
  padding:16px;
  border-radius:14px;
  background:#e3f2fd;
  max-width:620px;
  margin-left:auto;
  margin-right:auto;
}

#endScreen{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  align-items:center;
  justify-content:center;
}
#endBox{
  background:white;
  padding:40px;
  border-radius:20px;
  font-size:22px;
}
</style>
</head>

<body>

<header>
🎡 __TITLE__
<br>
<div id="scoreBox">Punkty: 0</div>
</header>

<div id="wheel-box">
<div id="pointer">🔻</div>
<div id="wheel"></div>
</div>

<button id="spinBtn" onclick="spin()">Zakręć kołem</button>

<div id="panel"></div>
<div id="feedback"></div>

<div id="endScreen">
  <div id="endBox">
    🎯 Gra ukończona!<br><br>
    <span id="finalScore"></span><br><br>
    <button onclick="location.reload()">Zagraj ponownie</button>
  </div>
</div>

<script>

const categories = __GAME_DATA__;
categories.forEach(cat=>cat.remaining=[...cat.questions]);

const wheel=document.getElementById("wheel");

/* ===== GENEROWANIE RADIALNYCH SEGMENTÓW ===== */

categories.forEach((cat,index)=>{

  const segment=document.createElement("div");
  segment.className="segment";
  segment.style.transform=`rotate(${index*60+30}deg)`;

  const label=document.createElement("span");
  label.innerText=cat.name;

  segment.appendChild(label);
  wheel.appendChild(segment);
});

/* ===== RESZTA LOGIKI (BEZ ZMIAN) ===== */

let score=0;
let rotation=0;
let spinning=false;
let solved=0;
let answered=false;
const TOTAL=18;

const segments=document.querySelectorAll(".segment");
const panel=document.getElementById("panel");
const feedback=document.getElementById("feedback");
const spinBtn=document.getElementById("spinBtn");

function shuffleArray(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}

function spin(){

 if(spinning || solved>=TOTAL) return;

 const active = categories
   .map((c,i)=>c.remaining.length>0?i:null)
   .filter(i=>i!==null);

 if(active.length===0){
   endGame();
   return;
 }

 spinning=true;
 feedback.style.display="none";
 panel.innerHTML="";
 answered=false;
 segments.forEach(s=>s.classList.remove("active"));

 const index = active[Math.floor(Math.random()*active.length)];
 const targetAngle=(360-(index*60+30))%360;

 rotation+=720+targetAngle-(rotation%360);
 wheel.style.transform=`rotate(${rotation}deg)`;

 setTimeout(()=>{
   showQuestion(index);
   spinning=false;
 },4000);
}

function showQuestion(index){

 const cat=categories[index];
 segments[index].classList.add("active");

 const q=cat.remaining.splice(
   Math.floor(Math.random()*cat.remaining.length),1
 )[0];

 solved++;

 panel.innerHTML=`<b>${cat.name}</b><br><br>${q.q}`;

 const answers=q.a.map((t,i)=>({text:t,correct:i===q.correct}));
 shuffleArray(answers);

 answers.forEach(ans=>{
   const btn=document.createElement("div");
   btn.className="answer";
   btn.innerText=ans.text;

   btn.onclick=function(){

     if(answered) return;
     answered=true;

     document.querySelectorAll(".answer")
       .forEach(b=>b.style.pointerEvents="none");

     if(ans.correct){
       btn.classList.add("correct");
       score++;
       document.getElementById("scoreBox").innerText="Punkty: "+score;
       feedback.innerHTML=q.explanation;
     }else{
       btn.classList.add("wrong");
       feedback.innerHTML="Niepoprawna odpowiedź.<br><br>"+q.explanation;
     }

     feedback.style.display="block";
     spinBtn.disabled=true;

     if(cat.remaining.length===0){
       segments[index].classList.add("completed");
     }

     setTimeout(()=>{
       spinBtn.disabled=false;
       if(solved===TOTAL){
         endGame();
       }
     },4000);
   };

   panel.appendChild(btn);
 });
}

function endGame(){
 document.getElementById("finalScore").innerText=
   "Twój wynik: "+score+" / "+TOTAL;
 document.getElementById("endScreen").style.display="flex";
}

</script>

</body>
</html>
