<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Gra mapa Europy</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #dbeafe, #e0f2fe);
  color: #1e293b;

  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;

  overflow: hidden;
}

h1 {
  margin: 6px 10px 2px;
  font-size: 26px;
  font-weight: 700;
  text-align: center;
  font-family: 'Cinzel', serif;
  letter-spacing: 1px;
}
#topbar {

  position: relative;

  width: 1120px;
  height: 52px;

  border-radius: 999px;

  overflow: hidden;

  margin-bottom: 14px;

  background:
    rgba(255,255,255,0.22);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.12),
    inset 0 2px 8px rgba(255,255,255,0.25);

  backdrop-filter: blur(8px);
min-height: 62px;
max-height: 62px;
}

#topbarFill {

  position: absolute;

  left: 0;
  top: 0;

  width: 0%;
  height: 100%;

  border-radius: 999px;

  background:
    linear-gradient(
      90deg,
      #60a5fa,
      #818cf8,
      #a78bfa
    );

  box-shadow:
    0 0 22px rgba(129,140,248,0.45);

  transition:
    width 0.05s linear;
}
#topbarText {

  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
 justify-content: flex-start;
padding-left: 34px;
box-sizing: border-box;

  z-index: 2;

  font-size: 20px;
  font-weight: 700;

  color: white;

  letter-spacing: 0.2px;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.25);

  white-space: nowrap;

  pointer-events: none;
}
@keyframes stagePop {

  0% {
    opacity: 0;
    transform: scale(0.7) translateY(-20px);
    filter: blur(6px);
  }

  40% {
    opacity: 1;
    transform: scale(1.12) translateY(0);
    filter: blur(0);
  }

  70% {
    transform: scale(0.96);
  }

  100% {
    transform: scale(1);
  }
}

#result {
  font-size: 22px;
  margin: 5px;
  height: 32px;
  font-weight: 700;
  color: #0f172a;
}

.good-anim {
  animation: popGood 0.4s ease;
  color: #16a34a !important;
}

@keyframes popGood {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  70% { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.bad-anim {
  animation: shake 0.35s;
  color: #dc2626 !important;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
  100% { transform: translateX(0); }
}

#score, #remaining {
  font-size: 16px;
  margin: 2px;
}

#maps {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 10px;
  flex: 1;
  align-items: flex-start;
}

.map-container {
  background: white;
  border-radius: 16px;
  padding: 10px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
}

canvas {
  border-radius: 10px;
  background: black;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.label {
  margin-bottom: 6px;
  font-weight: 600;
  font-size: 14px;
}

/* ===== ETAP 3 ===== */

#tribeStage {
  display: none;
  width: 100%;
  justify-content: center;
  align-items: flex-start;
  gap: 30px;
  margin-top: 6px;
}

#tribeInfo {
  width: 320px;
  min-height: 500px;
  background: white;
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

#tribeImage {
  width: 100%;
  border-radius: 12px;
  margin-bottom: 14px;
  display: none;
}
/* ===== HUD ===== */

#hud {
  display: flex;
  align-items: center;
  gap: 24px;

  margin-top: 4px;
  margin-bottom: 4px;
}

#scoreBox {
  background: linear-gradient(135deg, #facc15, #f59e0b);

  color: white;

  font-weight: 700;
  font-size: 17px;

  padding: 9px 18px;

  border-radius: 16px;

  box-shadow: 0 6px 18px rgba(0,0,0,0.18);
}

#progressWrapper {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#progressText {
  font-size: 15px;
  font-weight: 600;
  color: #334155;
}

#progressBar {
  width: 320px;
  height: 18px;

  background: rgba(255,255,255,0.7);

  border-radius: 999px;

  overflow: hidden;

  box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
}

#progressFill {
  width: 0%;
  height: 100%;

  background: linear-gradient(90deg, #22c55e, #16a34a);

  border-radius: 999px;

  transition: width 0.35s ease;
}
/* ===== OVERLAY ETAPU ===== */

.stage-overlay-card {

  background:
    linear-gradient(180deg, #ffffff, #f8fafc);

  padding: 45px;

  border-radius: 28px;

  text-align: center;

  width: 460px;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.35);

  animation:
    overlayPop 0.6s ease;
}

.stage-overlay-title {

  font-size: 42px;

  font-weight: 800;

  margin-bottom: 14px;

  color: #f59e0b;

  text-shadow:
    0 0 18px rgba(245,158,11,0.35);
}

.stage-overlay-text {

  font-size: 21px;

  color: #334155;

  line-height: 1.5;

  margin-bottom: 28px;
}

.stage-overlay-btn {

  border: none;

  background:
    linear-gradient(135deg, #2563eb, #1d4ed8);

  color: white;

  font-size: 20px;

  font-weight: 700;

  padding: 16px 34px;

  border-radius: 18px;

  cursor: pointer;

  transition: 0.25s;

  box-shadow:
    0 10px 24px rgba(37,99,235,0.35);
}

.stage-overlay-btn:hover {

  transform:
    scale(1.06);

  box-shadow:
    0 14px 28px rgba(37,99,235,0.45);
}

@keyframes overlayPop {

  0% {
    opacity: 0;
    transform:
      scale(0.7)
      translateY(40px);
  }

  100% {
    opacity: 1;
    transform:
      scale(1)
      translateY(0);
  }
}
#tribeTitleBar {

  position: relative;

  width: 100%;
  height: 58px;

  border-radius: 999px;

  overflow: hidden;

  margin-bottom: 18px;

  background:
    rgba(255,255,255,0.12);

  box-shadow:
    0 6px 20px rgba(0,0,0,0.14),
    inset 0 1px 5px rgba(255,255,255,0.18);
}

#tribeTitleFill {

  position: absolute;

  left: 0;
  top: 0;

  width: 0%;
  height: 100%;

  border-radius: 999px;

  transition:
    width 0.05s linear;
}

#tribeTitle {

  position: absolute;

  left: 28px;
  top: 50%;

  transform: translateY(-50%);

  z-index: 2;

  color: white;

  font-size: 28px;
  font-weight: 800;

  letter-spacing: 0.4px;

  text-shadow:
    0 2px 10px rgba(0,0,0,0.3);

  white-space: nowrap;
}
#tribeSymbolWrap {
background: transparent;
  width: 100%;

  display: flex;
  justify-content: center;

  margin-top: 16px;
}

#tribeSymbol {

  width: 170px;
  height: 170px;

  object-fit: contain;

  opacity: 0;

  filter:
    drop-shadow(0 6px 16px rgba(0,0,0,0.25));

  transform:
    scale(0.7)
    rotate(-6deg);

  transition:
    all 0.45s ease;
}
#tribeSymbol.show {

  opacity: 1;

  transform:
    scale(1)
    rotate(0deg);
}
</style>

</head>
<body>

<h1 id="title">Etap pierwszy - Imperium Karola Wielkiego</h1>

<div id="topbar">

  <div id="topbarFill"></div>

  <div id="topbarText"></div>

</div>
<div id="result"></div>

<div id="hud">

  <div id="scoreBox">
    ⭐ Punkty: <span id="score">0</span>
  </div>

  <div id="progressWrapper">

    <div id="progressText">
      Postęp: <span id="remaining">7</span>
    </div>

    <div id="progressBar">
      <div id="progressFill"></div>
    </div>

  </div>

</div>

<div id="maps">

  <div class="map-container">
    <div class="label">Europa 815</div>
    <canvas id="historyCanvas" width="700" height="450"></canvas>
  </div>

  <div class="map-container">
    <div class="label">Europa dziś</div>
    <canvas id="gameCanvas" width="700" height="450"></canvas>
  </div>

</div>

<!-- ===== ETAP 3 ===== -->

<div id="tribeStage">

  <div class="map-container">
    <canvas id="tribeCanvas" width="700" height="500"></canvas>
  </div>

  <div id="tribeInfo">

    <img id="tribeImage">

   <div id="tribeTitleBar">

  <div id="tribeTitleFill"></div>

  <div id="tribeTitle"></div>

</div>

    <p id="tribeDesc"></p>

    <p id="tribeCities"></p>
<div id="tribeSymbolWrap">

  <img id="tribeSymbol" src="" alt="symbol">

</div>
  </div>

</div>

<script src="js/main.js"></script>

</body>
</html>
