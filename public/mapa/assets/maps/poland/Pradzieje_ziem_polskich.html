<!DOCTYPE html><html lang='pl'><head><meta charset='UTF-8'><title>Pradzieje ziem polskich</title><link href='https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap' rel='stylesheet'><style>body{font-family:Inter,sans-serif;background:radial-gradient(circle at top,#eef4fb,#ffffff);margin:0;text-align:center}header{font-family:'Playfair Display',serif;padding:10px 0 4px 0;font-size:24px}#scoreBox{display:inline-block;margin-top:6px;padding:6px 18px;font-size:15px;background:white;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.15)}#wheel-box{position:relative;width:280px;height:280px;margin:10px auto 0 auto}#wheel{width:100%;height:100%;border-radius:50%;border:6px solid #222;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform 4s cubic-bezier(.2,.7,.25,1);background:conic-gradient(#1E5E44 0 60deg,#F0B234 60deg 120deg,#EB703C 120deg 180deg,#CA366C 180deg 240deg,#EC962E 240deg 300deg,#489EA0 300deg 360deg)}.segment{position:absolute;width:100%;height:100%;top:0;left:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;pointer-events:none;transition:opacity .4s ease;text-align:center}.segment span{display:flex;align-items:center;justify-content:center;width:72px;height:72px;transform:translateY(-92px);border-radius:50%;padding:8px;line-height:1.15}.segment.active span{background:rgba(255,255,255,.92);box-shadow:0 0 18px rgba(255,255,255,.95),0 0 30px rgba(255,255,255,.5);transform:translateY(-92px) scale(1.08)}.segment.completed{opacity:.25}#pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:26px;color:#ff3b3b;text-shadow:0 0 8px rgba(255,0,0,.6);z-index:5}#spinBtn{margin-top:16px;padding:10px 28px;font-size:16px;border:none;border-radius:28px;background:linear-gradient(#ffb74d,#f57c00);color:white;cursor:pointer}.answer{margin:6px auto;padding:10px;border-radius:12px;border:2px solid #444;background:#f7f7f7;cursor:pointer;width:420px;max-width:90%}.correct{background:#c8f7c5 !important;border-color:#2e7d32 !important}.wrong{background:#ffcdd2 !important;border-color:#c62828 !important}#feedback{display:none;margin-top:8px;padding:16px;border-radius:14px;background:#e3f2fd;max-width:620px;margin:auto}#endScreen{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}#endBox{background:white;padding:40px;border-radius:20px;font-size:22px}</style></head><body><header>🎡 Pradzieje ziem polskich<br><div id='scoreBox'>Punkty: 0</div></header><div id='wheel-box'><div id='pointer'>🔻</div><div id='wheel'><div class='segment' style='transform:rotate(30deg)'><span>Pradzieje ziem polskich</span></div><div class='segment' style='transform:rotate(90deg)'><span>Przybycie Słowian</span></div><div class='segment' style='transform:rotate(150deg)'><span>Państwa wczesnosłowiańskie</span></div><div class='segment' style='transform:rotate(210deg)'><span>Słowianie na ziemiach Polski</span></div><div class='segment' style='transform:rotate(270deg)'><span>Wierzenia słowiańskie</span></div><div class='segment' style='transform:rotate(330deg)'><span>Pozostałości wierzeń słowiańskich</span></div></div></div><button id='spinBtn' onclick='spin()'>Zakręć kołem</button><div id='panel'></div><div id='feedback'></div><div id='endScreen'><div id='endBox'>🎯 Gra ukończona!<br><br><span id='finalScore'></span><br><br><button onclick='location.reload()'>Zagraj ponownie</button></div></div><script>let score=0;let rotation=0;let spinning=false;let solved=0;const TOTAL=18;const wheel=document.getElementById('wheel');const panel=document.getElementById('panel');const feedback=document.getElementById('feedback');const spinBtn=document.getElementById('spinBtn');function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}const categories=[{"name":"Pradzieje ziem polskich","questions":[{"q":"Jakie są najstarsze ślady człowieka na ziemiach polskich?","a":["Około 800 tysięcy lat","Około 10 tysięcy lat","Około 5 tysięcy lat"],"correct":2,"explanation":"Najstarsze ślady człowieka na ziemiach polskich pochodzą sprzed około 800 tysięcy lat. Osady te były jednak niewielkie i rozproszone."},{"q":"Co to są kurhany?","a":["Grobowce w kształcie kopca","Miejsca kultu religijnego","Dawne osady obronne"],"correct":0,"explanation":"Kurhany to grobowce w kształcie kopca, w których znajdowane są ludzkie szkielety. Były używane do pochówku zmarłych z różnymi przedmiotami."},{"q":"Gdzie znajduje się Biskupin?","a":["W Wielkopolsce","Na Śląsku","Na Pomorzu"],"correct":0,"explanation":"Biskupin to znana osada warowna, której pozostałości znajdują się w Wielkopolsce. Osada ta została zbudowana na wyspie."}]},{"name":"Przybycie Słowian","questions":[{"q":"W jakich wiekach Słowianie osiedlali się w Europie?","a":["V-VIII wiek","III-V wiek","IX-X wiek"],"correct":0,"explanation":"Słowianie zaczęli osiedlać się w Europie w V-VIII wieku. Zajęli tereny wschodniej, środkowej i południowej Europy."},{"q":"Jakie zajęcia dominowały wśród Słowian?","a":["Rolnictwo i hodowla","Rzemiosło i handel","Wojna i podboje"],"correct":0,"explanation":"Słowianie głównie zajmowali się rolnictwem i hodowlą zwierząt. Znali również rzemiosła takie jak garncarstwo."},{"q":"Kto był głównym bogiem Słowian?","a":["Perun","Świętowit","Mokosz"],"correct":0,"explanation":"Perun był głównym bogiem Słowian, czczonym jako władca nieba i piorunów. Słowianie oddawali mu cześć przez składanie ofiar."}]},{"name":"Państwa wczesnosłowiańskie","questions":[{"q":"Gdzie powstało Państwo Wielkomorawskie?","a":["Na Morawach","Na Łużycach","Na Pomorzu"],"correct":0,"explanation":"Państwo Wielkomorawskie powstało około 830 roku na Morawach. Było to jedno z pierwszych państw słowiańskich."},{"q":"Kim byli Cyryl i Metody?","a":["Misjonarzami chrystianizującymi Słowian","Władcami państwa Wielkomorawskiego","Kapłanami słowiańskich bogów"],"correct":0,"explanation":"Cyryl i Metody byli misjonarzami, którzy chrystianizowali Słowian. Uczyli ich także pisma i nabożeństw w języku słowiańskim."},{"q":"Jakie państwo powstało we wschodniej części Słowiańszczyzny?","a":["Ruś Kijowska","Państwo Wielkomorawskie","Polanie"],"correct":0,"explanation":"Na wschodnich obszarach Słowiańszczyzny powstało państwo znane jako Ruś Kijowska. Było jednym z ważniejszych państw wczesnosłowiańskich."}]},{"name":"Słowianie na ziemiach Polski","questions":[{"q":"Które plemię zamieszkiwało okolice Gniezna?","a":["Polanie","Pomorzanie","Wiślanie"],"correct":0,"explanation":"Plemię Polan zamieszkiwało okolice Gniezna i stworzyło silne państwo w X wieku. Było jednym z najważniejszych plemion słowiańskich."},{"q":"Gdzie powstało państwo Wiślan?","a":["W okolicach Krakowa","Na Pomorzu","Na Śląsku"],"correct":0,"explanation":"Państwo Wiślan powstało w okolicach Krakowa i Wiślicy. Było jednym z ważniejszych państw na ziemiach polskich przed zjednoczeniem Polan."},{"q":"Które plemię zamieszkiwało tereny Mazowsza?","a":["Mazowszanie","Pomorzanie","Wiślanie"],"correct":0,"explanation":"Mazowszanie zamieszkiwali tereny Mazowsza, które było jednym z głównych obszarów zamieszkiwanych przez Słowian na ziemiach polskich."}]},{"name":"Wierzenia słowiańskie","questions":[{"q":"Jakie miejsce było szczególnie ważne dla Słowian?","a":["Święte gaje","Kurhany","Osady warowne"],"correct":0,"explanation":"Słowianie uważali święte gaje za miejsca szczególnej czci. Odprawiali tam obrzędy ku czci swoich bogów."},{"q":"Kiedy obchodzona jest noc świętojańska?","a":["23/24 czerwca","2 listopada","1 maja"],"correct":0,"explanation":"Noc świętojańska obchodzona jest w najkrótszą noc w roku, 23/24 czerwca. Jest to tradycyjne święto słowiańskie związane z miłością i płodnością."},{"q":"Kto był boginią śmierci w wierzeniach słowiańskich?","a":["Marzanna","Mokosz","Perun"],"correct":0,"explanation":"Marzanna była boginią śmierci w wierzeniach słowiańskich. Wiosną palono jej kukłę jako symbol zakończenia zimy."}]},{"name":"Pozostałości wierzeń słowiańskich","questions":[{"q":"Jakie święto wywodzi się ze słowiańskich tradycji?","a":["Dzień Zaduszny","Wielkanoc","Boże Narodzenie"],"correct":0,"explanation":"Dzień Zaduszny obchodzony 2 listopada wywodzi się z tradycji słowiańskich. Był to czas modlitw za zmarłych i wspomnień przodków."},{"q":"Co było symbolem zakończenia zimy w dawnych czasach?","a":["Topienie Marzanny","Rozpalanie ognisk","Składanie ofiar z plonów"],"correct":0,"explanation":"Topienie kukły Marzanny było symbolem zakończenia zimy. Marzanna była słowiańską boginią śmierci i zimy."},{"q":"Jakie obrzędy były popularne w noc świętojańską?","a":["Odpływanie wianków na wodzie","Palenie ognisk","Skakanie przez płomienie"],"correct":0,"explanation":"W noc świętojańską popularne było odpływanie wianków na wodzie. Był to symbol miłości i poszukiwania partnera."}]}];categories.forEach(c=>c.remaining=[...c.questions]);function spin(){if(spinning){rotation+=360;wheel.style.transform='rotate('+rotation+'deg)';return;}const segments=document.querySelectorAll('.segment');const active=categories.map((c,i)=>c.remaining.length>0?i:null).filter(i=>i!==null);if(active.length===0){endGame();return;}spinning=true;feedback.style.display='none';panel.innerHTML='';segments.forEach(s=>s.classList.remove('active'));const index=active[Math.floor(Math.random()*active.length)];const targetAngle=(360-(index*60+30))%360;rotation+=720+targetAngle-(rotation%360);wheel.style.transform='rotate('+rotation+'deg)';setTimeout(()=>{showQuestion(index);spinning=false;},4000);}function showQuestion(index){const segments=document.querySelectorAll('.segment');const cat=categories[index];segments[index].classList.add('active');const q=cat.remaining.splice(Math.floor(Math.random()*cat.remaining.length),1)[0];solved++;panel.innerHTML='<b>'+cat.name+'</b><br><br>'+q.q;const answers=q.a.map((t,i)=>({text:t,correct:i===q.correct}));shuffleArray(answers);answers.forEach(ans=>{const btn=document.createElement('div');btn.className='answer';btn.innerText=ans.text;btn.onclick=function(){if(spinning)return;if(ans.correct){btn.classList.add('correct');score++;document.getElementById('scoreBox').innerText='Punkty: '+score;feedback.innerHTML=q.explanation;}else{btn.classList.add('wrong');feedback.innerHTML='Niepoprawna odpowiedź.';}feedback.style.display='block';spinBtn.disabled=true;if(cat.remaining.length===0){segments[index].classList.add('completed');}setTimeout(()=>{spinBtn.disabled=false;if(solved===TOTAL)endGame();},3000);};panel.appendChild(btn);});}function endGame(){document.getElementById('finalScore').innerText='Twój wynik: '+score+' / '+TOTAL;document.getElementById('endScreen').style.display='flex';}</script></body></html>
