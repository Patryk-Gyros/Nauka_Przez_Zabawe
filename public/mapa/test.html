<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>DEBUG KLIK</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}

canvas {
  margin-top: 20px;
  border: 2px solid #444;
}
</style>

</head>

<body>

<h2>DEBUG: Kliknij mapę</h2>

<canvas id="gameCanvas" width="1000" height="700"></canvas>

<script>
window.onload = function () {

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const img = new Image();
    const hitmap = new Image();

    img.src = "/mapa/assets/maps/europe_now.png";
    hitmap.src = "/mapa/assets/maps/europe_now.hitmap.png";

    const hitCanvas = document.createElement("canvas");
    const hitCtx = hitCanvas.getContext("2d", { willReadFrequently: true });

    // ===== HITMAP =====
    hitmap.onload = () => {
        hitCanvas.width = hitmap.width;
        hitCanvas.height = hitmap.height;
        hitCtx.drawImage(hitmap, 0, 0);
        console.log("HITMAP OK");
    };

    hitmap.onerror = () => {
        console.error("❌ HITMAP ERROR — sprawdź ścieżkę");
    };

    // ===== MAPA =====
    img.onload = () => {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        console.log("MAPA OK");
    };

    img.onerror = () => {
        console.error("❌ MAPA ERROR — sprawdź ścieżkę");
    };

    // ===== KLIK =====
    canvas.addEventListener("click", function (e) {

        console.log("CLICK!");

        const rect = canvas.getBoundingClientRect();

        const x = Math.floor(
            (e.clientX - rect.left) * (hitmap.width / rect.width)
        );

        const y = Math.floor(
            (e.clientY - rect.top) * (hitmap.height / rect.height)
        );

        console.log("coords:", x, y);

        try {
            const pixel = hitCtx.getImageData(x, y, 1, 1).data;

            console.log(
                "PIXEL:",
                pixel[0],
                pixel[1],
                pixel[2]
            );

        } catch (err) {
            console.error("❌ getImageData ERROR:", err);
        }

    });

};
</script>

</body>
</html>
